name: CI (Backend & Frontend Tests)

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile and test backend
        run: |
          docker run --rm \
            -e SERVERLESS=serverless \
            -v "${{ github.workspace }}/backend:/src" \
            -w /src \
            golang:1.26 \
            bash -c '
              set -euo pipefail
              go test -run "^$" -count=1 ./cmd/... ./pkg/... ./internal/...
              mapfile -t unit_packages < <(go list ./cmd/... ./pkg/... ./internal/... | grep -vFxf .ci/test-quarantine.txt)
              go test -short -count=1 "${unit_packages[@]}"
              go test -tags=integration -run "^$" -count=1 ./cmd/... ./pkg/... ./internal/...
            '

  frontend-test:
    runs-on: ubuntu-latest
    env:
      BCAI_LOCAL_BACKEND_URL: http://localhost:8888
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Lint
        run: |
          cd frontend
          npm run lint

      - name: Run Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test -- --run

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
