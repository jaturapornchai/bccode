name: CI (Backend & Frontend Tests)

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Backend compile gate
        run: |
          docker run --rm \
            -e SERVERLESS=serverless \
            -v "${{ github.workspace }}/backend:/src" \
            -w /src \
            golang:1.26 \
            go test -run "^$" -count=1 ./cmd/... ./pkg/... ./internal/...

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Lint
        run: |
          cd frontend
          npm run lint

      - name: Run Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test -- --run

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
