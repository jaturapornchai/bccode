name: CI (Backend & Frontend Tests)

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Report business tests awaiting contract confirmation
        run: |
          {
            echo '### Backend business-test quarantine'
            echo 'The following packages compile but their business tests are not run:'
            echo ''
            sed '/^#/d; /^[[:space:]]*$/d; s/^/- /' backend/.ci/test-quarantine.txt
            echo ''
            echo 'A green build does not certify these business contracts.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compile and test backend
        run: |
          docker run --rm \
            -e SERVERLESS=serverless \
            -v "${{ github.workspace }}/backend:/src" \
            -w /src \
            golang:1.26 \
            bash -c '
              set -euo pipefail
              go test -run "^$" -count=1 ./cmd/... ./pkg/... ./internal/...
              mapfile -t unit_packages < <(go list ./cmd/... ./pkg/... ./internal/... | grep -vFx -f <(tr -d "\r" < .ci/test-quarantine.txt))
              go test -short -count=1 "${unit_packages[@]}"
              go test -tags=integration -run "^$" -count=1 ./cmd/... ./pkg/... ./internal/...
            '

  frontend-test:
    runs-on: ubuntu-latest
    env:
      BCAI_LOCAL_BACKEND_URL: http://localhost:8888
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Lint
        run: |
          cd frontend
          npm run lint

      - name: Run Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test -- --run

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  code-map-check:
    # docs/reference/CODE-MAP.md tells every AI agent which line to jump to instead of grepping
    # (AGENTS.md "Surgical Read"). It silently drifted to 87% wrong over 71 commits once, so the
    # map is now regenerated here and compared: if a large file moved and the map was not
    # regenerated, this job fails with the exact rows that shifted.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify CODE-MAP matches the source tree
        shell: pwsh
        run: ./tools/gen-code-map.ps1 -Check

  backend-outbox-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start isolated MongoDB replica set
        run: |
          set -euo pipefail
          docker run -d --name bc-outbox-ci mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            echo "MongoDB readiness attempt $attempt"
            if docker exec bc-outbox-ci mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec bc-outbox-ci mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'

      - name: Verify real transaction rollback and delivery recovery
        run: |
          set -euo pipefail
          docker run --rm --network container:bc-outbox-ci \
            -e SERVERLESS=serverless \
            -e BC_OUTBOX_TEST_MONGODB_URI='mongodb://127.0.0.1:27017/?replicaSet=rs0' \
            -v "${{ github.workspace }}/backend:/src" -w /src golang:1.26 \
            bash -c 'set -euo pipefail; go test -tags=integration -count=1 -timeout=120s -json -run "^TestProduct(Outbox|ServiceOutbox)Integration$" ./internal/product/product/outbox ./internal/product/product/services | tee outbox-test-results.json'


      - name: Verify Barcode replacement and duplicate replay
        run: |
          set -euo pipefail
          docker run -d --name bc-barcode-ci -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          for attempt in $(seq 1 30); do
            echo "PostgreSQL readiness attempt $attempt"
            if docker exec bc-barcode-ci pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker run --rm --network container:bc-barcode-ci \
            -e SERVERLESS=serverless \
            -e BC_BARCODE_TEST_POSTGRES_DSN='postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable' \
            -v "${{ github.workspace }}/backend:/src" -w /src golang:1.26 \
            bash -c 'set -euo pipefail; go test -tags=integration -count=1 -timeout=120s -json -run "^TestBarcodeBatchIntegration$" ./internal/goapi/handlers/kafka | tee barcode-test-results.json'

      - name: Save integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outbox-integration-results
          path: |
            backend/outbox-test-results.json
            backend/barcode-test-results.json
          if-no-files-found: warn

      - name: Remove isolated test database container
        if: always()
        run: docker rm -fv bc-outbox-ci bc-barcode-ci

  backend-projection-kafka-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start isolated Kafka, MongoDB and PostgreSQL 18
        run: |
          set -euo pipefail
          docker compose -p bc-projection-ci -f backend/.ci/projection.compose.yml up -d mongo mongo-init postgres kafka
          docker compose -p bc-projection-ci -f backend/.ci/projection.compose.yml up -d --wait mongo postgres kafka

      - name: Verify cross-topic fences and legacy writers
        run: |
          set -euo pipefail
          docker compose -p bc-projection-ci -f backend/.ci/projection.compose.yml run --rm --no-deps tests 'go test -tags=integration -count=1 -timeout=180s -json -run "^Test(Projection(Kafka|Rebalance)|BarcodeServiceOutbox|LegacyBarcode(Reconcile|PrimarySource))Integration$" ./internal/goapi/handlers/kafka ./internal/product/productbarcode/repositories ./internal/product/productbarcode/services ./internal/product/projection' | tee backend/projection-test-results.json

      - name: Save Kafka integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-kafka-integration-results
          path: backend/projection-test-results.json
          if-no-files-found: warn

      - name: Remove isolated Kafka test resources
        if: always()
        run: docker compose -p bc-projection-ci -f backend/.ci/projection.compose.yml down -v --remove-orphans
