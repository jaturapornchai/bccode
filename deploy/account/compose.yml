name: bcai-account

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    env_file: /etc/bcai-account/postgres.env
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 1024m
    logging: *default-logging

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    logging: *default-logging

  minio:
    image: minio/minio@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
    command: ["server", "/data"]
    env_file: /etc/bcai-account/minio.env
    restart: unless-stopped
    volumes:
      - minio-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 512m
    cpus: "1.0"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging: *default-logging

  minio-init:
    image: minio/mc@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780
    env_file: /etc/bcai-account/minio.env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null
        mc ready local
        mc mb --ignore-existing "local/$${MINIO_BUCKET_NAME}" >/dev/null
        mc version enable "local/$${MINIO_BUCKET_NAME}" >/dev/null
        mc anonymous set none "local/$${MINIO_BUCKET_NAME}" >/dev/null
        mc admin policy create local bcai-account-app /etc/minio/policy.json >/dev/null
        (mc admin user add local "$${MINIO_APP_ACCESS_KEY}" "$${MINIO_APP_SECRET_KEY}" >/dev/null || mc admin user enable local "$${MINIO_APP_ACCESS_KEY}" >/dev/null)
        mc admin policy attach local bcai-account-app --user "$${MINIO_APP_ACCESS_KEY}" >/dev/null
        mc alias set app http://minio:9000 "$${MINIO_APP_ACCESS_KEY}" "$${MINIO_APP_SECRET_KEY}" >/dev/null
        mc stat "app/$${MINIO_BUCKET_NAME}" >/dev/null
    volumes:
      - ./minio-app-policy.json:/etc/minio/policy.json:ro
    networks: [data]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      MC_CONFIG_DIR: /tmp/.mc
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    logging: *default-logging

  mainapi:
    image: ${MAINAPI_IMAGE:?MAINAPI_IMAGE is required}
    env_file: /etc/bcai-account/backend.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    ports:
      - 127.0.0.1:8888:8888
    volumes:
      - /var/lib/bcai-account/config:/app/bootstrap
    networks: [edge, data]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8888/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    mem_limit: 1536m
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    env_file: /etc/bcai-account/frontend.env
    depends_on:
      mainapi:
        condition: service_healthy
    restart: unless-stopped
    init: true
    ports:
      - 127.0.0.1:3200:3000
    networks: [edge]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    mem_limit: 768m
    logging: *default-logging

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
