name: smlaicloud
description: SML AI Cloud Flutter Application.
publish_to: "none"
version: 1.1.0+13

environment:
  sdk: ^3.8.0
  flutter: ">=1.17.0"

dependencies:
  # Core Flutter
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State Management (Latest)
  flutter_bloc: ^9.1.1
  bloc: ^9.0.1

  # HTTP & Network (Latest)
  http: ^1.5.0
  web_socket_channel: ^3.0.2

  # Firebase (Latest)
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0

  # UI & Layout (Latest)
  flutter_spinkit: ^5.2.1
  loader_overlay: ^5.0.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.0.11
  flutter_colorpicker: ^1.1.0
  font_awesome_flutter: ^10.10.0

  # Missing packages found
  split_view: ^3.2.1
  auto_size_text: ^3.0.0
  qr_flutter: ^4.1.0
  flutter_draggable_gridview: ^0.0.13
  flutter_dropzone: ^4.2.1

  # More missing packages
  flutter_rounded_date_picker: ^3.0.4
  barcode_widget: ^2.0.4
  percent_indicator: ^4.2.3
  flutter_map: ^7.0.2
  geolocator: ^13.0.3
  flutter_map_location_marker: ^9.1.1
  awesome_ripple_animation: ^2.0.0

  # Database & Storage (Latest)

  # Google Services (Latest)
  google_fonts: ^6.2.1
  gsheets: ^0.5.0
  google_mlkit_text_recognition: ^0.15.0 # แทน google_ml_vision deprecated
  google_maps_flutter: ^2.9.0

  # Buddhist calendar support
  thai_buddhist_date: ^0.2.7
  google_maps_flutter_platform_interface: ^2.9.5
  google_maps_flutter_web: ^0.5.10
  latlong2: ^0.9.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0
  google_sign_in_platform_interface: ^3.1.0
  oauth2: ^2.0.3

  # Device & Platform (Latest)
  device_info_plus: ^11.5.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

  # Media & Files (Latest)
  file_picker: ^10.3.3
  image_picker: ^1.1.2
  image_picker_web: ^4.0.0
  image_cropper: ^11.0.0 # แทน image_crop deprecated
  video_player: ^2.9.2
  video_player_web: ^2.3.3
  crypto: ^3.0.3

  # PDF & Documents (Latest)
  syncfusion_flutter_pdfviewer: ^31.1.21
  syncfusion_flutter_charts: ^31.1.21
  pdf: ^3.11.1
  printing: ^5.13.4
  archive: ^3.6.1

  # UI Components (Latest)
  cupertino_icons: ^1.0.8
  data_table_2: ^2.5.15
  decimal: ^3.0.2
  decorated_icon: ^1.2.1
  dio: ^5.7.0
  dropdown_search: ^6.0.2
  email_validator: ^3.0.0
  excel: ^4.0.6
  flash: ^3.1.1
  flex_color_picker: ^3.6.0
  flutter_html: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_screenutil: ^5.9.3
  flutter_dotenv: ^6.0.0
  flutter_native_splash: ^2.4.4
  fluttertoast: ^9.0.0
  lottie: ^3.3.0
  get_it: ^8.0.2
  group_radio_button: ^1.3.0
  graphview: ^1.2.0
  invert_colors: ^0.0.4
  icon_decoration: ^2.1.0
  loading_animation_widget: ^1.3.0
  number_inc_dec: ^0.8.0
  permission_handler: ^12.0.1
  network_to_file_image: ^7.0.0
  package_info_plus: ^9.0.0
  pretty_json: any
  uuid: ^4.5.1
  translator: ^1.0.0
  scrollable_positioned_list: ^0.3.8
  tuple: ^2.0.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  json_view: ^0.4.2
  flutter_cache_manager: ^3.4.1

  # Web Support (Latest - Replaced deprecated packages)
  flutter_inappwebview: ^6.1.5 # ✅ แทน webview_flutter deprecated
  flutter_widget_from_html: ^0.17.1 # ✅ แทน flutter_html deprecated

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  build_runner: ^2.4.0
  json_serializable: ^6.8.0
  equatable: ^2.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/img/
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/flags/
    - assets/logos/
    - assets/
    - assets/file_import/

  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Italic.ttf
  #         style: italic
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon-1024x1024.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/icon-1024x1024.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/icon-1024x1024.png"
    icon_size: 48

flutter_native_splash:
  color: "#42a5f5"
  image: assets/images/splash.png
  color_dark: "#042a49"
  image_dark: assets/images/splash-invert.png

  android_12:
    image: assets/images/splash.png
    icon_background_color: "#42a5f5"
    image_dark: assets/images/splash-invert.png
    icon_background_color_dark: "#042a49"

  web: false
