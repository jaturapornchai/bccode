<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BC AI Cloud">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="smlaicloud">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>smlaicloud</title>
  <link rel="manifest" href="manifest.json">

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
  <script type="text/javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js";
  </script>

  <!-- Google Maps -->
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAQYY9WaatF31ZsR69rb1zY73bLHWR-KcM&loading=async"></script>

  <!-- Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Flutter bootstrap -->
  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
  <!-- Loading indicator -->
  <div id="loading" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    z-index: 1000;
  ">
    <!-- Logo Circle -->
    <div style="
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 30px;
    ">
      <div style="
        position: absolute;
        width: 80px;
        height: 80px;
        border: 3px solid transparent;
        border-top: 3px solid rgba(255,255,255,0.8);
        border-right: 3px solid rgba(255,255,255,0.4);
        border-radius: 50%;
        animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      "></div>

      <div style="
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50px;
        height: 50px;
        background: rgba(255,255,255,0.15);
        border-radius: 50%;
        backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse 2s ease-in-out infinite;
      ">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 10C19.3 10 20.4 10.4 21.3 11.1C21.7 10.1 22 9 22 8C22 4.7 19.3 2 16 2C13.4 2 11.2 3.6 10.3 5.9C9.9 5.8 9.5 5.7 9 5.7C6.2 5.7 4 7.9 4 10.7C4 11.1 4 11.4 4.1 11.8C2.3 12.5 1 14.2 1 16.2C1 18.9 3.1 21 5.8 21H18C20.2 21 22 19.2 22 17C22 14.8 20.2 13 18 13V10Z" fill="white" opacity="0.9"/>
        </svg>
      </div>
    </div>

    <!-- Loading dots -->
    <div style="display: flex; gap: 8px; margin-top: 10px;">
      <div style="width: 8px; height: 8px; background: rgba(255,255,255,0.8); border-radius: 50%; animation: bounce 1.4s ease-in-out 0s infinite;"></div>
      <div style="width: 8px; height: 8px; background: rgba(255,255,255,0.8); border-radius: 50%; animation: bounce 1.4s ease-in-out 0.2s infinite;"></div>
      <div style="width: 8px; height: 8px; background: rgba(255,255,255,0.8); border-radius: 50%; animation: bounce 1.4s ease-in-out 0.4s infinite;"></div>
    </div>
  </div>

  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.8; }
    }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.8; }
      40% { transform: translateY(-10px); opacity: 1; }
    }
    #loading { transition: opacity 0.5s ease-out; }
  </style>

  <script>
    // Hide loading screen when Flutter engine starts rendering
    var _loadingCheckInterval = setInterval(function() {
      var fltGlassPane = document.querySelector('flt-glass-pane') || document.querySelector('flutter-view');
      if (fltGlassPane) {
        clearInterval(_loadingCheckInterval);
        var loading = document.getElementById('loading');
        if (loading) {
          loading.style.opacity = '0';
          setTimeout(function() { loading.remove(); }, 500);
        }
      }
    }, 200);
    // Fallback: hide after 15 seconds no matter what
    setTimeout(function() {
      clearInterval(_loadingCheckInterval);
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(function() { loading.remove(); }, 500);
      }
    }, 15000);
  </script>
</body>
</html>
