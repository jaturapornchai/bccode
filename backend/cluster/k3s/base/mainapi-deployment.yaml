apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainapi
  namespace: bc-ai-account
  labels:
    app.kubernetes.io/name: mainapi
    app.kubernetes.io/part-of: bc-ai-account
spec:
  replicas: 6
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mainapi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mainapi
        app.kubernetes.io/part-of: bc-ai-account
    spec:
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mainapi
      containers:
        - name: mainapi
          image: ghcr.io/jaturapornchai/bccode-mainapi:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
          env:
            - name: GO_ENV
              value: production
            - name: DEV_API_MODE
              value: "2"
            - name: SERVICE_PORT
              value: "8888"
            - name: TZ
              value: Asia/Bangkok
            - name: GODEBUG
              value: x509negativeserial=1
          volumeMounts:
            - name: bootstrap
              mountPath: /app/bootstrap.json
              subPath: bootstrap.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: bootstrap
          secret:
            secretName: mainapi-bootstrap
---
apiVersion: v1
kind: Service
metadata:
  name: mainapi
  namespace: bc-ai-account
  labels:
    app.kubernetes.io/name: mainapi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mainapi
  ports:
    - name: http
      port: 8888
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mainapi
  namespace: bc-ai-account
spec:
  minAvailable: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: mainapi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mainapi
  namespace: bc-ai-account
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mainapi
  minReplicas: 6
  maxReplicas: 40
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mainapi
  namespace: bc-ai-account
spec:
  ingressClassName: traefik
  rules:
    - host: bc-ai-account.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mainapi
                port:
                  name: http
