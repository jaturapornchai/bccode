apiVersion: v1
kind: Secret
metadata:
  name: mainapi-bootstrap
  namespace: bc-ai-account
type: Opaque
stringData:
  bootstrap.json: |
    {
      "mongodb_dev": {
        "uri": "mongodb+srv://DEV_USER:DEV_PASSWORD@dev.example.mongodb.net/?retryWrites=true&w=majority",
        "database": "bc_dev"
      },
      "mongodb_uat": {
        "uri": "mongodb+srv://UAT_USER:UAT_PASSWORD@uat.example.mongodb.net/?retryWrites=true&w=majority",
        "database": "bc_uat"
      },
      "mongodb_pro": {
        "uri": "mongodb+srv://PRO_USER:PRO_PASSWORD@pro.example.mongodb.net/?retryWrites=true&w=majority",
        "database": "bc_pro"
      },
      "postgresql": {
        "host": "postgresql.example.internal",
        "port": "5432",
        "user": "postgres",
        "password": "CHANGE_ME",
        "db_name": "bc_ai_account",
        "ssl_mode": "require",
        "timezone": "Asia/Bangkok"
      },
      "clickhouse": {
        "host": "clickhouse.example.internal",
        "port": "9000",
        "user": "default",
        "password": "CHANGE_ME",
        "database_name": "bcbiprod"
      },
      "kafka": {
        "server_url": "kafka.example.internal:9092"
      },
      "storage": {
        "s3_endpoint": "https://object-storage.example.internal",
        "s3_bucket_name": "bc-ai-account-files",
        "s3_access_key_id": "CHANGE_ME",
        "s3_secret_access_key": "CHANGE_ME"
      },
      "service": {
        "enable_kafka": "true",
        "log_level": "INFO"
      }
    }

