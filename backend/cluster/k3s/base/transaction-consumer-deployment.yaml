apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-consumer
  namespace: bc-ai-account
  labels:
    app.kubernetes.io/name: transaction-consumer
    app.kubernetes.io/part-of: bc-ai-account
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-consumer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transaction-consumer
        app.kubernetes.io/part-of: bc-ai-account
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: transaction-consumer
      containers:
        - name: transaction-consumer
          image: ghcr.io/jaturapornchai/bccode-mainapi:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
          env:
            - name: GO_ENV
              value: production
            - name: DEV_API_MODE
              value: "1"
            - name: SERVICE_PORT
              value: "8888"
            - name: CONSUMER_GROUP_NAME
              value: k3s-v1
            - name: TZ
              value: Asia/Bangkok
            - name: GODEBUG
              value: x509negativeserial=1
          volumeMounts:
            - name: bootstrap
              mountPath: /app/bootstrap.json
              subPath: bootstrap.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: bootstrap
          secret:
            secretName: mainapi-bootstrap
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: transaction-consumer
  namespace: bc-ai-account
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-consumer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: transaction-consumer
  namespace: bc-ai-account
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transaction-consumer
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120
