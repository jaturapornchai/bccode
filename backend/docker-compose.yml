# ========================================
# BC Ai Account Backend - Docker Compose
# ใช้ไฟล์เดียวกันทุก environment (Docker Desktop, VPS, Production)
# ========================================
#
# PORT STANDARD (กฏมาตรฐาน — ใช้ทุกที่เหมือนกัน):
# ┌─────────────────────┬────────┬────────────────────────────────┐
# │ Service             │ Port   │ หมายเหตุ                      │
# ├─────────────────────┼────────┼────────────────────────────────┤
# │ MainAPI (Gateway)   │  8888  │ 0.0.0.0 — จุดเข้าเดียว        │
# │   /goapi/*          │        │   → goapi (embedded)          │
# │   /*                │        │   → mainapi routes            │
# ├─────────────────────┼────────┼────────────────────────────────┤
# │ MongoDB             │ 27017  │ NATIVE (systemd) — ไม่อยู่ Docker │
# │ PostgreSQL          │  5432  │ NATIVE (systemd) — ไม่อยู่ Docker │
# │ Redis               │  6379  │ 127.0.0.1                     │
# │ Kafka (KRaft)       │  9092  │ 127.0.0.1                     │
# └─────────────────────┴────────┴────────────────────────────────┘
# Local: http://localhost:8888
# MongoDB + PostgreSQL = NATIVE (ไม่อยู่ใน Docker — ข้อมูลปลอดภัย)
# Docker containers เข้า DB ผ่าน host.docker.internal

services:
  # ─── Infrastructure ───────────────────────

  # MongoDB + PostgreSQL = NATIVE (systemd service บน host)
  # Docker containers เข้าผ่าน host.docker.internal:27017 / :5432

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - app-network

  kafka:
    image: confluentinc/confluent-local:latest
    container_name: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    networks:
      - app-network

  mainapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mainapi
    env_file:
      - path: ./storage.local.env
        required: false
    depends_on:
      - redis
      - kafka
    ports:
      - "8888:8888"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    user: root
    environment:
      GO_ENV: development
      BC_ENV: "${BC_ENV:-}"
      DEV_API_MODE: "2"
      SERVICE_PORT: "8888"
      LOG_LEVEL: DEBUG
      TZ: Asia/Bangkok
      KAFKA_SERVER_URL: "kafka:29092"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-212036599086-c7aqvm005jiv2kqi4duju8spd9b3jb94.apps.googleusercontent.com}"
      FIREBASE_PROJECT_ID: "test06-a1240"
      GODEBUG: "x509negativeserial=1"
      # Dev Login remains disabled unless all three server-side values are supplied.
      # Keep the secret outside git (for example in the caller's environment).
      BCAI_DEV_LOGIN_ENABLED: "${BCAI_DEV_LOGIN_ENABLED:-false}"
      BCAI_DEV_LOGIN_USER_UID: "${BCAI_DEV_LOGIN_USER_UID:-}"
      BCAI_DEV_LOGIN_SECRET: "${BCAI_DEV_LOGIN_SECRET:-}"
      BCAI_DEMO_LOGIN_ENABLED: "${BCAI_DEMO_LOGIN_ENABLED:-true}"
      BCAI_DEMO_USERNAME: "${BCAI_DEMO_USERNAME:-demo}"
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_BUCKET_NAME: "${R2_BUCKET_NAME:-}"
      R2_ENDPOINT: "${R2_ENDPOINT:-}"
      R2_FORCE_PATH_STYLE: "${R2_FORCE_PATH_STYLE:-true}"
    volumes:
      - ./bootstrap.json:/app/bootstrap.json:ro
      - ${BCAI_CUSTOM_CONFIG_FILE:-./custom_config.json}:/app/custom_config.json:rw
      - ./tdict-std.txt:/app/tdict-std.txt
      - ./docs/swagger.json:/app/docs/swagger.json:ro
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
  kafka-data:
