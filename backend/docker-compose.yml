# ========================================
# BC Ai Account Backend - Docker Compose
# ใช้ไฟล์เดียวกันทุก environment (Docker Desktop, VPS, Production)
# ========================================
#
# PORT STANDARD (กฏมาตรฐาน — ใช้ทุกที่เหมือนกัน):
# ┌─────────────────────┬────────┬────────────────────────────────┐
# │ Service             │ Port   │ หมายเหตุ                      │
# ├─────────────────────┼────────┼────────────────────────────────┤
# │ MainAPI (Gateway)   │  8888  │ 0.0.0.0 — จุดเข้าเดียว        │
# │   /goapi/*          │        │   → goapi (embedded)          │
# │   /*                │        │   → mainapi routes            │
# ├─────────────────────┼────────┼────────────────────────────────┤
# │ MongoDB             │ 27017  │ NATIVE (systemd) — ไม่อยู่ Docker │
# │ PostgreSQL          │  5432  │ NATIVE (systemd) — ไม่อยู่ Docker │
# │ Redis               │  6379  │ 127.0.0.1                     │
# │ ClickHouse HTTP     │ 18123  │ 127.0.0.1 (native=8123)       │
# │ ClickHouse Native   │ 19000  │ 127.0.0.1 (native=9000)       │
# │ Kafka (KRaft)       │  9092  │ 127.0.0.1                     │
# │ SeaweedFS Master    │  9333  │ 127.0.0.1                     │
# │ SeaweedFS Filer     │ 18888  │ 127.0.0.1                     │
# │ SeaweedFS S3        │ 18333  │ 127.0.0.1                     │
# └─────────────────────┴────────┴────────────────────────────────┘
# Local: http://localhost:8888
# MongoDB + PostgreSQL = NATIVE (ไม่อยู่ใน Docker — ข้อมูลปลอดภัย)
# Docker containers เข้า DB ผ่าน host.docker.internal

services:
  # ─── Infrastructure ───────────────────────

  # MongoDB + PostgreSQL = NATIVE (systemd service บน host)
  # Docker containers เข้าผ่าน host.docker.internal:27017 / :5432

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - app-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "127.0.0.1:18123:8123"
      - "127.0.0.1:19002:9000"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}"
      TZ: Asia/Bangkok
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    restart: unless-stopped
    networks:
      - app-network

  kafka:
    image: confluentinc/confluent-local:latest
    container_name: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
  clickhouse-data:
  clickhouse-logs:
  kafka-data:

